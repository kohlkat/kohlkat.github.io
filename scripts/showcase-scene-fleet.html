<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SAGE distributed learning showcase</title>
  <style>
    html, body { margin: 0; background: #0a1014; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
/**
 * Multi-worker teaching grid — public-safe SIMULATED visualization of
 * distributed randomized-stock / unsupervised world-sim style learning.
 * Materials match showcase-scene-v4 (ACES metal). Not Isaac / not physical.
 */
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const params = new URLSearchParams(location.search);
let progress = Number(params.get("progress") || "0");
const width = Number(params.get("w") || "1280");
const height = Number(params.get("h") || "720");
const COLS = 8;
const ROWS = 5;
const CELL = 0.42;
const SHAPES = ["circle", "rounded_rectangle", "slot"];

function rnd(seed) {
  let s = (seed * 1103515245 + 12345) >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 0xffffffff;
  };
}

function pathLocal(shape, p, hx, hy) {
  const phase = 2 * Math.PI * (p % 1);
  if (shape === "circle") return [hx * Math.cos(phase), hy * Math.sin(phase)];
  if (shape === "slot") return [hx * Math.cos(phase), hy * Math.sin(phase)];
  // compact rounded rect sample
  const r = Math.min(hx, hy) * 0.35;
  const c = Math.cos(phase), s = Math.sin(phase);
  const ax = Math.sign(c || 1) * (hx - r + r * Math.abs(c));
  const ay = Math.sign(s || 1) * (hy - r + r * Math.abs(s));
  // superellipse-ish for density at corners in grid view
  const n = 3.5;
  const px = Math.pow(Math.abs(c), 2 / n) * Math.sign(c || 1) * hx;
  const py = Math.pow(Math.abs(s), 2 / n) * Math.sign(s || 1) * hy;
  return [px, py];
}

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(width, height, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1218);
scene.fog = new THREE.Fog(0x0c1218, 6, 18);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, width / height, 0.05, 40);
camera.position.set(0.2, 5.2, 6.4);
camera.lookAt(0.2, 0, 0.1);

const metal = new THREE.MeshStandardMaterial({
  color: 0x9aa3ab, metalness: 0.78, roughness: 0.38, envMapIntensity: 0.95,
});
const stockMat = new THREE.MeshStandardMaterial({
  color: 0x7a8690, metalness: 0.7, roughness: 0.45, envMapIntensity: 0.85,
});
const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x2c343c, metalness: 0.72, roughness: 0.42, envMapIntensity: 0.8,
});
const accent = new THREE.MeshStandardMaterial({
  color: 0x0a6e96, metalness: 0.45, roughness: 0.4, envMapIntensity: 0.75,
});
const grooveMat = new THREE.MeshStandardMaterial({
  color: 0x14181c, metalness: 0.55, roughness: 0.35, envMapIntensity: 0.55,
});
const activeMat = new THREE.MeshStandardMaterial({
  color: 0x1a8ab8, metalness: 0.5, roughness: 0.35, envMapIntensity: 0.9, emissive: 0x063040, emissiveIntensity: 0.35,
});

const key = new THREE.DirectionalLight(0xfff1e4, 2.2);
key.position.set(3, 8, 4);
scene.add(key);
scene.add(new THREE.DirectionalLight(0xc5d8f0, 1.0).translateX(-4).translateY(3));
scene.add(new THREE.AmbientLight(0x6a7a88, 0.4));
scene.add(new THREE.HemisphereLight(0xd0e0f0, 0x1a2026, 0.5));

const floor = new THREE.Mesh(new THREE.BoxGeometry(14, 0.06, 10), new THREE.MeshStandardMaterial({
  color: 0x0d1216, metalness: 0.25, roughness: 0.65,
}));
floor.position.y = -0.03;
scene.add(floor);

const workers = [];
const originX = -((COLS - 1) * CELL) / 2;
const originZ = -((ROWS - 1) * CELL) / 2;

for (let row = 0; row < ROWS; row++) {
  for (let col = 0; col < COLS; col++) {
    const id = row * COLS + col;
    const seed = 274600 + id * 17;
    const r = rnd(seed);
    const shape = SHAPES[id % 3];
    const sx = 0.12 + r() * 0.06;
    const sy = 0.08 + r() * 0.05;
    const sz = 0.03 + r() * 0.02;
    const pathHalf = shape === "circle"
      ? [Math.min(sx, sy) * 0.28, Math.min(sx, sy) * 0.28]
      : shape === "slot"
        ? [sx * 0.32, sy * 0.12]
        : [sx * 0.28, sy * 0.24];
    const phaseOff = r();
    const group = new THREE.Group();
    group.position.set(originX + col * CELL, 0, originZ + row * CELL);

    const pad = new THREE.Mesh(new THREE.BoxGeometry(CELL * 0.92, 0.02, CELL * 0.92), darkMetal);
    pad.position.y = 0.01;
    const stock = new THREE.Mesh(new THREE.BoxGeometry(sx, sz, sy), stockMat);
    stock.position.y = 0.02 + sz / 2;
    const spindle = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.014, 0.05, 12), darkMetal);
    const cutter = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.03, 8), metal);
    cutter.position.y = -0.035;
    const tool = new THREE.Group();
    tool.add(spindle, cutter);

    const grooves = [];
    const nG = 48;
    for (let i = 0; i < nG; i++) {
      const g = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, sz * 0.45, 6), grooveMat);
      g.visible = false;
      g.position.y = 0.02 + sz - sz * 0.2;
      group.add(g);
      grooves.push(g);
    }

    const badge = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.008, 0.02), accent);
    badge.position.set(CELL * 0.28, 0.03, CELL * 0.32);

    group.add(pad, stock, tool, badge);
    scene.add(group);
    workers.push({ group, tool, stock, grooves, shape, pathHalf, phaseOff, sx, sy, sz, seed, badge });
  }
}

function paint(p) {
  progress = p;
  for (const w of workers) {
    // Stagger workers so the grid looks like parallel unsupervised learners
    const local = Math.min(1, Math.max(0, (progress + w.phaseOff * 0.85) % 1.15));
    const plunge = Math.min(local / 0.15, 1);
    const [lx, ly] = pathLocal(w.shape, local, w.pathHalf[0], w.pathHalf[1]);
    const top = 0.02 + w.sz;
    w.tool.position.set(lx, top - w.sz * 0.15 * plunge + 0.04, ly);
    const vis = Math.min(w.grooves.length, 1 + Math.floor(local * w.grooves.length));
    for (let i = 0; i < w.grooves.length; i++) {
      const [gx, gz] = pathLocal(w.shape, i / w.grooves.length, w.pathHalf[0], w.pathHalf[1]);
      w.grooves[i].position.x = gx;
      w.grooves[i].position.z = gz;
      w.grooves[i].visible = i < vis;
    }
    w.badge.material = local > 0.05 && local < 0.95 ? activeMat : accent;
  }
  // Slow orbit for "fleet" feel
  const ang = progress * Math.PI * 0.35;
  camera.position.set(Math.sin(ang) * 6.2 + 0.2, 5.0, Math.cos(ang) * 6.0);
  camera.lookAt(0.15, 0.05, 0);
  renderer.render(scene, camera);
  window.__SAGE_SHOWCASE_META__ = {
    mode: "fleet",
    workers: COLS * ROWS,
    progress,
    evidence_class: "SIMULATED",
  };
}

window.__SAGE_SET_PROGRESS__ = (p) => paint(Number(p));
window.__SAGE_SET_JOB__ = () => paint(progress);
paint(progress);
window.__SAGE_SHOWCASE_READY__ = true;
</script>
</body>
</html>
