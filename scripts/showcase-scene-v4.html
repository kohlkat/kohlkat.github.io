<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SAGE public showcase v4</title>
  <style>
    html, body { margin: 0; background: #0a1014; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const params = new URLSearchParams(location.search);
let mode = params.get("mode") || "cnc";
let shape = params.get("shape") || "circle";
let seed = Number(params.get("seed") || "274500");
let progress = Number(params.get("progress") || "0");
const width = Number(params.get("w") || "1280");
const height = Number(params.get("h") || "720");

/** Link lengths (m) for 2-DOF planar arm (shoulder → elbow → wrist). Sized to reach stock. */
const L1 = 0.55;
const L2 = 0.48;
/** Wrist → tool tip local offset (tool points −Y in wrist frame). */
const TIP_OFFSET = 0.22;
/** Shoulder world height and base XY (pedestal top). */
const SHOULDER_Y = 0.88;
const BASE_X = -0.12;
const BASE_Z = 0.0;

/** Arc-length rounded rectangle: 4 straights + 4 corner arcs (full corners cut). */
function roundedRectPoint(p, hx, hy, ox, oy) {
  const r = Math.min(hx, hy) * 0.38;
  const w = Math.max(hx - r, 1e-6);
  const h = Math.max(hy - r, 1e-6);
  const arc = (Math.PI / 2) * r;
  const segs = [
    { type: "line", len: 2 * h, x0: hx, y0: -h, x1: hx, y1: h },
    { type: "arc", len: arc, cx: w, cy: h, a0: 0, a1: Math.PI / 2 },
    { type: "line", len: 2 * w, x0: w, y0: hy, x1: -w, y1: hy },
    { type: "arc", len: arc, cx: -w, cy: h, a0: Math.PI / 2, a1: Math.PI },
    { type: "line", len: 2 * h, x0: -hx, y0: h, x1: -hx, y1: -h },
    { type: "arc", len: arc, cx: -w, cy: -h, a0: Math.PI, a1: (3 * Math.PI) / 2 },
    { type: "line", len: 2 * w, x0: -w, y0: -hy, x1: w, y1: -hy },
    { type: "arc", len: arc, cx: w, cy: -h, a0: (3 * Math.PI) / 2, a1: 2 * Math.PI },
  ];
  const peri = segs.reduce((s, g) => s + g.len, 0);
  let d = (((p % 1) + 1) % 1) * peri;
  for (const g of segs) {
    if (d <= g.len + 1e-12) {
      const t = g.len > 0 ? d / g.len : 0;
      if (g.type === "line") {
        return [ox + g.x0 + (g.x1 - g.x0) * t, oy + g.y0 + (g.y1 - g.y0) * t];
      }
      const ang = g.a0 + (g.a1 - g.a0) * t;
      return [ox + g.cx + r * Math.cos(ang), oy + g.cy + r * Math.sin(ang)];
    }
    d -= g.len;
  }
  return [ox + hx, oy];
}

function pathPoint(shape, p, half, offset = [0, 0]) {
  const [hx, hy] = half;
  const [ox, oy] = offset;
  const phase = 2 * Math.PI * (p % 1);
  if (shape === "circle") return [ox + hx * Math.cos(phase), oy + hy * Math.sin(phase)];
  if (shape === "rounded_rectangle") return roundedRectPoint(p, hx, hy, ox, oy);
  return [ox + hx * Math.cos(phase), oy + hy * Math.sin(phase)];
}

function sceneFor(shape, seed) {
  let s = (seed * 1103515245 + 12345) >>> 0;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0xffffffff; };
  const stock = [0.28 + rnd() * 0.08, 0.2 + rnd() * 0.07, 0.05 + rnd() * 0.03];
  let pathHalf;
  if (shape === "circle") {
    const r = Math.min(stock[0], stock[1]) * (0.22 + rnd() * 0.1);
    pathHalf = [r, r];
  } else if (shape === "rounded_rectangle") {
    pathHalf = [stock[0] * 0.26, stock[1] * 0.24];
  } else {
    pathHalf = [stock[0] * 0.3, stock[1] * 0.12];
  }
  return { stock, pathHalf, pathOffset: [0, 0], targetDepth: 0.008 + rnd() * 0.004 };
}

/**
 * Analytic 2-link IK: wrist above tip by TIP_OFFSET (tool −Y = world −Y).
 * Joint frame: shoulder/elbow rotate about local X; 0 = link along +Y;
 * positive pitch swings toward +Z in the yawed base frame.
 * Returns { yaw, shoulder, elbow } in radians.
 */
function armIk(tipX, tipY, tipZ) {
  const dx = tipX - BASE_X;
  const dz = tipZ - BASE_Z;
  const yaw = Math.atan2(dx, dz);
  // Wrist is TIP_OFFSET above tip when tool points straight down (−world Y).
  const wy = tipY + TIP_OFFSET;
  const planar = Math.hypot(dx, dz);
  const dy = wy - SHOULDER_Y;
  let dist = Math.hypot(planar, dy);
  const maxR = L1 + L2 - 0.01;
  const minR = Math.abs(L1 - L2) + 0.01;
  dist = Math.max(minR, Math.min(maxR, dist));
  const cosElbow = (L1 * L1 + L2 * L2 - dist * dist) / (2 * L1 * L2);
  const elbowInterior = Math.acos(Math.max(-1, Math.min(1, cosElbow)));
  // Elbow: 0 = straight; positive folds (line−alpha branch).
  const elbow = Math.PI - elbowInterior;
  const cosShoulder = (dist * dist + L1 * L1 - L2 * L2) / (2 * dist * L1);
  const alpha = Math.acos(Math.max(-1, Math.min(1, cosShoulder)));
  // Angle of shoulder→wrist from +Y toward +Z, then subtract alpha (elbow-down).
  const line = Math.atan2(planar, dy);
  const shoulder = line - alpha;
  return { yaw, shoulder, elbow };
}

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(width, height, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12181e);
scene.fog = new THREE.Fog(0x12181e, 4.5, 12);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, width / height, 0.02, 40);

const metal = new THREE.MeshStandardMaterial({
  color: 0x9aa3ab, metalness: 0.78, roughness: 0.38, envMapIntensity: 0.95,
});
const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x2c343c, metalness: 0.72, roughness: 0.42, envMapIntensity: 0.8,
});
const accent = new THREE.MeshStandardMaterial({
  color: 0x0a6e96, metalness: 0.45, roughness: 0.4, envMapIntensity: 0.75,
});
const grooveMat = new THREE.MeshStandardMaterial({
  color: 0x14181c, metalness: 0.55, roughness: 0.35, envMapIntensity: 0.55,
});
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x0d1216, metalness: 0.25, roughness: 0.65,
});
const stockMat = new THREE.MeshStandardMaterial({
  color: 0x7a8690, metalness: 0.7, roughness: 0.45, envMapIntensity: 0.85,
});
const jointMat = new THREE.MeshStandardMaterial({
  color: 0x3a4550, metalness: 0.8, roughness: 0.35, envMapIntensity: 0.9,
});

const key = new THREE.DirectionalLight(0xfff1e4, 2.4);
key.position.set(2.0, 3.2, 1.8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0002;
scene.add(key);
const fill = new THREE.DirectionalLight(0xc5d8f0, 1.15);
fill.position.set(-2.2, 1.8, 1.0);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe0c0, 0.85);
rim.position.set(-0.2, 1.6, -2.2);
scene.add(rim);
scene.add(new THREE.AmbientLight(0x6a7a88, 0.38));
scene.add(new THREE.HemisphereLight(0xd0e0f0, 0x1a2026, 0.55));

const floor = new THREE.Mesh(new THREE.BoxGeometry(8, 0.08, 8), floorMat);
floor.position.y = -0.04;
floor.receiveShadow = true;
scene.add(floor);

const root = new THREE.Group();
scene.add(root);

// ---- Tool (spindle): tip at local (0, -TIP_OFFSET, 0) ----
const tool = new THREE.Group();
tool.name = "teachingSpindle";
const housing = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.045, 0.12, 24), darkMetal);
housing.position.y = -0.04;
housing.castShadow = true;
const holder = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.024, 0.06, 16), metal);
holder.position.y = -0.12;
const cutter = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.07, 12), metal);
cutter.position.y = -0.185; // bottom ≈ -0.22 = -TIP_OFFSET
tool.add(housing, holder, cutter);

// ---- Robot kinematic chain: pedestal → baseYaw → shoulder → upper → elbow → forearm → wrist → tool ----
// Links overlap joint spheres so the arm reads as one continuous machine.
const robot = new THREE.Group();
robot.name = "robot";
const pedestalH = SHOULDER_Y - 0.08;
const pedestal = new THREE.Mesh(new THREE.BoxGeometry(0.28, pedestalH, 0.28), accent);
pedestal.position.set(BASE_X, pedestalH / 2, BASE_Z);
pedestal.castShadow = true;
const shoulderCap = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.08, 20), darkMetal);
shoulderCap.position.set(BASE_X, SHOULDER_Y - 0.04, BASE_Z);
shoulderCap.castShadow = true;

const baseYaw = new THREE.Group();
baseYaw.name = "baseYaw";
baseYaw.position.set(BASE_X, SHOULDER_Y, BASE_Z);

const shoulder = new THREE.Group();
shoulder.name = "shoulder";
const shoulderJoint = new THREE.Mesh(new THREE.SphereGeometry(0.07, 18, 16), jointMat);
shoulderJoint.castShadow = true;

// Slightly longer than L1 so mesh overlaps elbow joint (no visual gap).
const upperArm = new THREE.Mesh(new THREE.BoxGeometry(0.1, L1 + 0.06, 0.1), metal);
upperArm.position.y = L1 / 2;
upperArm.castShadow = true;

const elbow = new THREE.Group();
elbow.name = "elbow";
elbow.position.y = L1;
const elbowJoint = new THREE.Mesh(new THREE.SphereGeometry(0.065, 18, 16), jointMat);
elbowJoint.castShadow = true;

const forearm = new THREE.Mesh(new THREE.BoxGeometry(0.09, L2 + 0.06, 0.09), metal);
forearm.position.y = L2 / 2;
forearm.castShadow = true;

const wrist = new THREE.Group();
wrist.name = "wrist";
wrist.position.y = L2;
const wristJoint = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 14), jointMat);
wristJoint.castShadow = true;
const wristMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.07, 14), darkMetal);
wristMesh.rotation.x = Math.PI / 2;
wristMesh.position.y = -0.01;
wrist.add(wristJoint, wristMesh);

// Continuous chain: tool is always a child of wrist for robot mode.
wrist.add(tool);
elbow.add(elbowJoint, forearm, wrist);
shoulder.add(shoulderJoint, upperArm, elbow);
baseYaw.add(shoulder);
robot.add(pedestal, shoulderCap, baseYaw);
root.add(robot);

const machine = new THREE.Group();
root.add(machine);

let stock = null;
let grooveMeshes = [];
let stockY = 0.5;
const grooveCount = 160; // denser samples so corners fully fill

function clearGroup(g) {
  while (g.children.length) {
    const ch = g.children[0];
    g.remove(ch);
    if (ch.geometry) ch.geometry.dispose();
  }
}

function rebuildJob() {
  clearGroup(machine);
  if (stock) {
    root.remove(stock);
    stock.geometry.dispose();
    stock = null;
  }
  for (const g of grooveMeshes) {
    root.remove(g);
    g.geometry.dispose();
  }
  grooveMeshes = [];

  const variant = sceneFor(shape, seed);
  const stockH = variant.stock[2];
  stock = new THREE.Mesh(
    new THREE.BoxGeometry(variant.stock[0], stockH, variant.stock[1]),
    stockMat,
  );
  stock.castShadow = true;
  stock.receiveShadow = true;
  const tableTopZ = mode === "cnc" ? 0.44 : 0.92;
  stockY = tableTopZ + stockH / 2 + 0.002;
  stock.position.set(mode === "cnc" ? 0 : 0.35, stockY, 0);
  root.add(stock);

  for (const zOff of [variant.stock[1] / 2 + 0.03, -(variant.stock[1] / 2 + 0.03)]) {
    const j = new THREE.Mesh(
      new THREE.BoxGeometry(variant.stock[0] + 0.06, 0.04, 0.035),
      accent,
    );
    j.position.set(stock.position.x, tableTopZ + 0.02, zOff);
    j.castShadow = true;
    machine.add(j);
  }

  // Continuous cut trail: short tubes between consecutive path samples (fills corners).
  const grooveY = stockY + stockH / 2 - variant.targetDepth / 2;
  const gRad = 0.01;
  for (let i = 0; i < grooveCount; i++) {
    const [lx0, ly0] = pathPoint(shape, i / grooveCount, variant.pathHalf, variant.pathOffset);
    const [lx1, ly1] = pathPoint(
      shape,
      (i + 1) / grooveCount,
      variant.pathHalf,
      variant.pathOffset,
    );
    const ax = stock.position.x + lx0;
    const az = stock.position.z + ly0;
    const bx = stock.position.x + lx1;
    const bz = stock.position.z + ly1;
    const dx = bx - ax;
    const dz = bz - az;
    const len = Math.hypot(dx, dz) || 0.001;
    const g = new THREE.Mesh(
      new THREE.CylinderGeometry(gRad, gRad, len + gRad * 0.6, 10),
      grooveMat,
    );
    g.position.set((ax + bx) / 2, grooveY, (az + bz) / 2);
    // Align cylinder +Y to segment in XZ plane
    g.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      new THREE.Vector3(dx, 0, dz).normalize(),
    );
    g.visible = false;
    root.add(g);
    grooveMeshes.push(g);
  }

  robot.visible = mode === "robot";
  if (mode === "cnc") {
    // CNC: free spindle (not on arm). Reparent tool to root.
    if (tool.parent !== root) root.add(tool);
    const table = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.06, 0.75), metal);
    table.position.set(0, 0.42, 0);
    table.receiveShadow = true;
    const riser = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.5), darkMetal);
    riser.position.set(0, 0.2, 0);
    machine.add(table, riser);
    // Close framing so tool + stock + cut path read clearly on video.
    camera.position.set(0.38, 0.78, 0.52);
    camera.up.set(0, 1, 0);
    camera.lookAt(0, stockY + 0.02, 0);
    camera.fov = 32;
    camera.updateProjectionMatrix();
  } else {
    // Robot: continuous chain — tool must stay under wrist.
    if (tool.parent !== wrist) wrist.add(tool);
    tool.position.set(0, 0, 0);
    tool.rotation.set(0, 0, 0);
    const table = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.1, 0.7), darkMetal);
    table.position.set(0.35, 0.87, 0);
    table.receiveShadow = true;
    machine.add(table);
    camera.position.set(0.95, 1.22, 0.88);
    camera.up.set(0, 1, 0);
    camera.lookAt(stock.position.x, stockY + 0.04, stock.position.z);
    camera.fov = 34;
    camera.updateProjectionMatrix();
  }

  window.__SAGE_VARIANT__ = variant;
}

function paint(p) {
  progress = p;
  const variant = window.__SAGE_VARIANT__;
  const stockH = variant.stock[2];
  const plunge = Math.min(progress / 0.12, 1);
  const [lx, ly] = pathPoint(shape, progress, variant.pathHalf, variant.pathOffset);
  const tipY = stockY + stockH / 2 - variant.targetDepth * plunge + 0.001;
  const tipX = stock.position.x + lx;
  const tipZ = stock.position.z + ly;

  if (mode === "cnc") {
    if (tool.parent !== root) root.add(tool);
    tool.position.set(tipX, tipY + TIP_OFFSET, tipZ);
    tool.rotation.set(0, progress * Math.PI * 18, 0);
  } else {
    // Continuous kinematic chain: IK → joints → wrist holds tool → tip on path.
    if (tool.parent !== wrist) wrist.add(tool);
    tool.position.set(0, 0, 0);
    tool.rotation.set(0, progress * Math.PI * 18, 0);
    const ik = armIk(tipX, tipY, tipZ);
    baseYaw.rotation.set(0, ik.yaw, 0);
    shoulder.rotation.set(ik.shoulder, 0, 0);
    elbow.rotation.set(ik.elbow, 0, 0);
    // Keep tool axis world-down: cancel residual wrist pitch so cutter −Y = world −Y.
    wrist.rotation.set(-(ik.shoulder + ik.elbow), 0, 0);
  }

  const visible = Math.min(grooveCount, 1 + Math.floor(progress * grooveCount));
  for (let i = 0; i < grooveCount; i++) grooveMeshes[i].visible = i < visible;

  // World-space tip for tests / stills metadata
  const tipWorld = new THREE.Vector3(0, -TIP_OFFSET, 0);
  tool.localToWorld(tipWorld);

  // Chain proof for automated checks
  const chain = [];
  let o = tool;
  while (o) {
    chain.push(o.name || o.type);
    o = o.parent;
  }

  renderer.render(scene, camera);
  window.__SAGE_SHOWCASE_META__ = {
    mode,
    shape,
    seed,
    progress,
    tip: { x: tipX, y: tipY, z: tipZ },
    tipWorld: { x: tipWorld.x, y: tipWorld.y, z: tipWorld.z },
    toolParent: tool.parent?.name || null,
    chain,
    robotHoldsTool: mode !== "robot" || tool.parent === wrist,
  };
}

window.__SAGE_SET_JOB__ = (m, sh, sd) => {
  mode = m; shape = sh; seed = Number(sd);
  rebuildJob();
  paint(0);
};
window.__SAGE_SET_PROGRESS__ = (p) => paint(Number(p));
window.__SAGE_ARM_IK__ = armIk;
window.__SAGE_TIP_OFFSET__ = TIP_OFFSET;

rebuildJob();
paint(progress);
window.__SAGE_SHOWCASE_READY__ = true;
</script>
</body>
</html>
